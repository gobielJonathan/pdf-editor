<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#2d2060"/>
    </linearGradient>
    <!-- Icon body gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#5a4fe0"/>
    </linearGradient>
    <!-- Icon fold gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a89cff"/>
      <stop offset="100%" stop-color="#7c6fff"/>
    </linearGradient>
    <!-- Accent glow -->
    <radialGradient id="glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#7c6fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c6fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="80"  cy="80"  r="120" fill="rgba(124,111,255,0.06)"/>
  <circle cx="1150" cy="570" r="160" fill="rgba(124,111,255,0.06)"/>
  <circle cx="1100" cy="80"  r="80"  fill="rgba(90,79,224,0.07)"/>

  <!-- Icon (scaled-up favicon, centered left) -->
  <g transform="translate(130, 165) scale(4.7)">
    <!-- document body -->
    <path d="M10 4 H44 L54 14 V60 H10 Z" fill="url(#docGrad)" rx="3"/>
    <!-- folded corner -->
    <path d="M44 4 L54 14 H44 Z" fill="url(#foldGrad)" opacity="0.85"/>
    <!-- fold crease -->
    <path d="M44 4 L44 14 H54" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <!-- content lines -->
    <rect x="16" y="24" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.55)"/>
    <rect x="16" y="31" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.55)"/>
    <rect x="16" y="38" width="24" height="3" rx="1.5" fill="rgba(255,255,255,0.55)"/>
    <!-- PDF badge -->
    <rect x="26" y="46" width="24" height="13" rx="6.5" fill="#ff4560"/>
    <text x="38" y="56.5" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
          font-size="7.5" font-weight="900" fill="#fff" letter-spacing="0.3">PDF</text>
  </g>

  <!-- Divider line -->
  <line x1="460" y1="180" x2="460" y2="450" stroke="rgba(124,111,255,0.35)" stroke-width="1.5"/>

  <!-- Text content -->
  <!-- App name -->
  <text x="530" y="270"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1">
    PDFEdit
  </text>

  <!-- Tagline -->
  <text x="533" y="330"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="400" fill="rgba(200,195,255,0.85)" letter-spacing="0.2">
    Free Online PDF Editor
  </text>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="533" y="370" width="178" height="38" rx="19" fill="rgba(124,111,255,0.22)" stroke="rgba(124,111,255,0.5)" stroke-width="1"/>
  <text x="622" y="394" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="rgba(200,195,255,0.95)">Edit &amp; Annotate</text>

  <!-- Pill 2 -->
  <rect x="723" y="370" width="148" height="38" rx="19" fill="rgba(124,111,255,0.22)" stroke="rgba(124,111,255,0.5)" stroke-width="1"/>
  <text x="797" y="394" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="rgba(200,195,255,0.95)">Sign PDFs</text>

  <!-- Pill 3 -->
  <rect x="533" y="420" width="148" height="38" rx="19" fill="rgba(255,69,96,0.2)" stroke="rgba(255,69,96,0.5)" stroke-width="1"/>
  <text x="607" y="444" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="rgba(255,170,180,0.95)">100% Private</text>

  <!-- Pill 4 -->
  <rect x="693" y="420" width="178" height="38" rx="19" fill="rgba(255,69,96,0.2)" stroke="rgba(255,69,96,0.5)" stroke-width="1"/>
  <text x="782" y="444" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="rgba(255,170,180,0.95)">No Upload Needed</text>

  <!-- Domain -->
  <text x="533" y="530"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22" fill="rgba(124,111,255,0.7)" letter-spacing="0.5">
    editpdf.gobiel.online
  </text>
</svg>
